<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elite Network</title><link rel="stylesheet" href="styles.css"><style>body{padding:24px}main{max-width:900px;margin:auto}.feed{display:grid;gap:14px}.feed-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.member{color:inherit;text-decoration:none}.member:hover,.member:focus{text-decoration:underline}.handle,.when{color:var(--muted);font-size:.92rem}.sport{font-weight:800;color:var(--gold)}</style></head><body><main><span class="eyebrow">ELITE NETWORK</span><h1>Athletes across Elite</h1><p>Public achievements and career moments from every Elite sport. Tap an athlete to open their permanent Elite identity.</p><div id="feed" class="feed">Loading network…</div><p><a class="btn secondary" href="/">← Elite Sports Hub</a> <a class="btn" href="/community.html">Community</a></p></main><script>
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){try{const r=await fetch("/api/activity/global");const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");feed.innerHTML=(d.activity||[]).map(x=>`<article class="feed-card"><a class="member" href="/profile.html?u=${encodeURIComponent(x.username)}"><strong>${esc(x.display_name||x.username)}</strong> <span class="handle">@${esc(x.username)}</span></a><div class="sport">${esc(x.icon||"🏆")} ${esc(x.sport_name||"Elite Sports")}</div><h3>${esc(x.title||x.activity_type||"Career update")}</h3><p>${esc(x.description||"")}</p><div class="when">${esc(x.occurred_at||"")}</div></article>`).join("")||"<p>No public activity yet.</p>"}catch(e){feed.textContent=e.message}}load();</script></body></html>
