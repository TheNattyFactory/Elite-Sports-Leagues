<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect EBL to Elite Sports</title><style>
body{margin:0;background:#081526;color:#f6f8fd;font:16px system-ui,-apple-system,sans-serif} main{max-width:510px;margin:12vh auto;padding:24px} h1{font-size:2.1rem}p{line-height:1.55;color:#acbed1}button{padding:15px 20px;border:0;background:#d83040;color:white;border-radius:8px;font-weight:800;font-size:1rem;cursor:pointer;width:100%}a{color:#9dd4fa}#status{min-height:48px}</style></head>
<body><main><p>ELITE BASEBALL LEAGUE × ELITE SPORTS LEAGUES</p><h1>Bring your career into Elite.</h1><p>This connects your existing EBL account to your Elite Sports identity. Your players, teams, salaries, and appearance never reset or move.</p><button id="connect">Verify my EBL account</button><p id="status" role="status" aria-live="polite"></p><p><a href="/">Back to EBL</a></p></main>
<script>
const status=document.querySelector('#status');
document.querySelector('#connect').onclick=async()=>{
  status.textContent='Checking your EBL sign-in…';
  try{
    const r=await fetch('/api/elite/account-proof',{credentials:'same-origin',cache:'no-store'});
    const d=await r.json();
    if(!r.ok){status.textContent=d.error==='AUTH_REQUIRED'?'Please sign in to EBL first, then reopen this page.':d.error==='EMAIL_VERIFICATION_REQUIRED'?'Verify your EBL email before linking.':'Unable to verify EBL account right now.';return;}
    if(!d.proof)throw Error('Missing verification');
    window.location.assign('https://elitesportsleagues.com/link-baseball.html#proof='+encodeURIComponent(d.proof));
  }catch(e){status.textContent='Connection could not be started. Please try again.';}
};
</script></body></html>
