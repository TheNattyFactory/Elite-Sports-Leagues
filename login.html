<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in • Elite Sports Leagues</title><link rel="stylesheet" href="/styles.css"><link rel="icon" href="/elite-crest.svg"></head>
<body><main class="auth-wrap"><section class="auth-card">
<a class="brand" href="/"><img class="brand-logo" src="/elite-sports-logo.svg" alt="Elite Sports Leagues"></a>
<h1>Welcome back.</h1><p class="muted">One login for every Elite sport.</p>
<form id="loginForm">
<div class="field"><label>Username or email</label><input id="identity" autocomplete="username" required></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="btn" style="width:100%">Sign in</button><div id="msg" class="message"></div>
</form><p class="muted" style="text-align:center"><a href="/reset-password.html" style="color:#ffd77a">Forgot password?</a></p>
<p class="muted" style="text-align:center">Need an account? <a href="/register.html" style="color:#ffd77a">Create one</a></p>
</section></main>
<script>
const f=document.getElementById('loginForm'),msg=document.getElementById('msg');
f.onsubmit=async e=>{
 e.preventDefault();msg.textContent='Signing in…';
 try{
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identity:identity.value,password:password.value})});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||'LOGIN_FAILED');
  location.href='/dashboard.html';
 }catch(err){msg.textContent=String(err.message||err).replaceAll('_',' ')}
}
</script></body></html>
