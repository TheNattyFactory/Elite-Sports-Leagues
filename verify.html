<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verify Email • Elite Sports Leagues</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .verify-shell{max-width:760px;margin:0 auto;padding:110px 40px 80px}
    .eyebrow{color:#f4c45b;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(2.3rem,7vw,4rem);margin:36px 0 26px}
    .lead{font-size:1.25rem;line-height:1.45;max-width:680px}
    label{display:block;margin:28px 0 10px;font-weight:700}
    input{width:100%;box-sizing:border-box;padding:18px 20px;font-size:1rem}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
    button{padding:17px 24px;border:0;border-radius:14px;font-size:1.05rem;font-weight:800;cursor:pointer}
    .primary{background:#f4c45b;color:#111}
    .secondary{background:#1b2a41;color:#fff}
    #status{margin-top:24px;font-size:1.05rem;line-height:1.45}
    .ok{color:#79d79b}.bad{color:#ff9ca9}.muted{color:#a9b4c6}
    .back{display:inline-block;margin-top:34px;color:inherit;text-decoration:none}
    @media(max-width:600px){.verify-shell{padding:90px 40px 60px}}
  </style>
</head>
<body>
<main class="verify-shell">
  <div class="eyebrow">Elite Account</div>
  <h1>Verify your email</h1>
  <p class="lead">Use the verification link sent to your email. If needed, you can also paste the verification token below.</p>

  <label for="token">Verification token</label>
  <input id="token" autocomplete="off" spellcheck="false" placeholder="Paste verification token">

  <div class="actions">
    <button id="verifyBtn" class="primary" type="button">Verify Account</button>
    <button id="resendBtn" class="secondary" type="button">Resend Email</button>
  </div>
  <div id="status" class="muted" aria-live="polite"></div>
  <a class="back" href="/login.html">← Back to sign in</a>
</main>

<script>
const tokenInput = document.getElementById('token');
const statusEl = document.getElementById('status');
const verifyBtn = document.getElementById('verifyBtn');
const resendBtn = document.getElementById('resendBtn');

function setStatus(text, kind='muted') {
  statusEl.textContent = text;
  statusEl.className = kind;
}

async function readJson(response) {
  const text = await response.text();
  try { return text ? JSON.parse(text) : {}; }
  catch { throw new Error('The server returned an unexpected response.'); }
}

async function verifyToken(rawToken) {
  const token = (rawToken || '').trim();
  if (!token) {
    setStatus('Enter the verification token from your email.', 'bad');
    return;
  }
  verifyBtn.disabled = true;
  setStatus('Verifying your Elite Sports account…');
  try {
    const response = await fetch('/api/auth/verify-email', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({token})
    });
    const data = await readJson(response);
    if (!response.ok) throw new Error(data.error || 'Verification failed.');
    setStatus('Account verified! Taking you to Elite Sports…', 'ok');
    setTimeout(() => { window.location.href = '/'; }, 900);
  } catch (err) {
    setStatus(err.message || 'Verification failed. Request a new email and try again.', 'bad');
    verifyBtn.disabled = false;
  }
}

verifyBtn.addEventListener('click', () => verifyToken(tokenInput.value));

resendBtn.addEventListener('click', async () => {
  resendBtn.disabled = true;
  setStatus('Sending a new verification email…');
  try {
    const response = await fetch('/api/auth/resend-verification', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      credentials: 'same-origin',
      body: '{}'
    });
    const data = await readJson(response);
    if (!response.ok) throw new Error(data.error || 'Could not resend verification email.');
    setStatus(data.already_verified ? 'Your account is already verified.' : 'A new verification email has been sent.', 'ok');
  } catch (err) {
    setStatus(err.message || 'Could not resend verification email.', 'bad');
  } finally {
    resendBtn.disabled = false;
  }
});

const params = new URLSearchParams(window.location.search);
const tokenFromLink = params.get('token');
if (tokenFromLink) {
  tokenInput.value = tokenFromLink;
  verifyToken(tokenFromLink);
}
</script>
</body>
</html>
