<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | Elite Sports</title><link rel="stylesheet" href="styles.css"></head>
<body><main style="max-width:650px;margin:60px auto;padding:24px">
<span class="eyebrow">ELITE ACCOUNT</span><h1>Password recovery</h1>
<section id="requestBox"><p>Enter your username or email. The response is intentionally the same whether the account exists or not.</p>
<input id="identity" placeholder="Username or email" style="width:100%;padding:12px;margin:8px 0 14px"><button class="btn primary" onclick="requestReset()">Send reset instructions</button></section>
<section id="resetBox" style="margin-top:28px"><h2>Choose a new password</h2><input id="resetToken" placeholder="Reset token" style="width:100%;padding:12px;margin:8px 0">
<input id="newPassword" type="password" minlength="10" placeholder="New password" style="width:100%;padding:12px;margin:8px 0 14px"><button class="btn primary" onclick="finishReset()">Reset password</button></section>
<p id="msg"></p><p><a href="/">← Back to Elite Sports</a></p>
<script>function getCsrf(){const m=document.cookie.match(/(?:^|;\\s*)elite_csrf=([^;]+)/);return m?decodeURIComponent(m[1]):''}

async function post(path,body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json",...(getCsrf()?{"X-CSRF-Token":getCsrf()}:{})},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function requestReset(){try{const d=await post("/api/auth/request-password-reset",{identity:identity.value});msg.textContent=d.message}catch(e){msg.textContent=e.message}}
async function finishReset(){try{await post("/api/auth/reset-password",{token:resetToken.value,password:newPassword.value});msg.textContent="Password changed. All older sessions were revoked.";setTimeout(()=>location.href="/",800)}catch(e){msg.textContent=e.message}}

const tokenFromUrl=new URLSearchParams(location.search).get("token")||"";
if(tokenFromUrl){
  resetToken.value=tokenFromUrl;
  requestBox.style.display="none";
  resetToken.style.display="none";
  msg.textContent="Reset link verified. Choose a new password.";
}
</script></main></body></html>
